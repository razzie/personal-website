description: |-
  I wanted to try out my [Ebiten Infinicave](/projects/id/ebiten-infinicave) library in a game, so I made Wormward,
  a real-time cave exploration game where you guide a worm through an infinite destructible cave.
  Use a bazooka, drill, spider silk and a rope gun to carve paths and swing through the terrain.
