hello: |
  My name is **Gábor Görzsöny**, but you might also know me as **Razzie** from my online presence.
  With a strong foundation in software engineering,
  I bring over 8+ years of formal experience across multiple sectors and programming languages, which doubles when including hobby projects.
  I am confident that I can deliver valuable solutions for you, your business partners and customers.

  My career began with a fascination for video games, which spurred me to self-learn coding from a young age.
  This journey has evolved significantly, steering me towards learning industry-standard techniques and cutting-edge technologies.

  In addition to my professional work, I am an avid hobbyist developer.
  I enjoy working on open-source projects, many of which are self-hosted.
  My recent ventures include developing a cloud platform and a range of Go-based software tools.

  I am deeply passionate about continuous learning and knowledge sharing.
  My friends and colleagues know me as someone who thrives on engaging in philosophical and technical discussions.
  Creativity and curiosity are the cornerstones of my work ethic, driving me to explore and innovate constantly.

  In my opinion, the greatest achievements in human history have resulted from collaborative efforts spearheaded by visionary leaders.
  My aspiration is to become one of these key individuals.

  I am currently **not** open for work.<br>
  If my [skills](/skills) and [experiences](/experience) align with your needs and you wish to request my insights or to collaborate with me,
  please feel free to reach out to me via email at <span id="email"></span>.
  I look forward to potential collaborations that challenge and inspire me.

skills: |
  Senior software engineer focused on **Go backend services** and **Kubernetes**.
  My work spans service, API and database design, testing, CI/CD and deployments across multiple regions.

  - ## Go / Golang
    - My primary programming language **since 2019**, building production **microservices**, tools and libraries
    - Strong understanding of **concurrency and parallelism**, including race conditions, synchronization and atomic operations
    - **Mentoring** developers new to Go
    - Creator of [Mock](/projects/id/mock), a testing library requiring work with Go internals: **ABI, garbage collection and reflection**
    - Working with **gin**, **chi**, **cobra**, **viper**, **pgx/pgxpool**, **zerolog** and **slog**

  - ## Kubernetes
    - Production experience **since 2021** with **EKS**, **OpenShift**, **Istio** and **custom operators**
    - Working with multiple clusters across multiple regions
    - Managing deployments with **Helm**, **Helmfile** and **Kustomize**

  - ## AI-assisted development
    Daily use of **GitHub Copilot** and **OpenAI Codex**, connecting **MCP servers** for additional context
    and using **reusable AI skills** and tools such as **rtk** and **superpowers**.

  - ## APIs & data
    - **REST**, **OpenAPI**, **gRPC**, **Protobuf** and **GraphQL**
    - Authentication with **OAuth**, **JWT** and **PASETO**
    - **PostgreSQL**, **SQLite**, **Redis** and **Valkey**; migrations with **goose** and **Liquibase**
    - Event-driven systems using **Redis Pub/Sub**, **Redis Streams**, **WebSockets** and **server-sent events (SSE)**

  - ## Cloud & delivery
    - **AWS**: IAM, RDS, S3, EKS and Route 53
    - **Docker**, **Terraform** and in-house infrastructure tooling
    - **Git**, **GitHub Actions**, **Harness** and **Jenkins**

  - ## Testing & observability
    - Unit, integration, smoke and end-to-end **testing**; micro and macro **benchmarking**
    - **testify**, **mockery** and **testcontainers-go**
    - Logging, metrics and instrumentation with **Datadog**, **Elasticsearch** and **OpenTelemetry**

  - ## Engineering practices
    - Service, database and API design; **event-driven** and **hexagonal architecture**
    - **Test-driven development**, maintainable code and the **Twelve-Factor App** principles
    - Collaboration in **Scrum** and **Kanban** teams

  - ## Additional background
    - **4+ years** of professional **C++** experience
    - Previous professional work with **C#/.NET**, **Java** and **Python**
    - Familiar with **HTML**, **CSS** and **JavaScript**, with some **React** experience

experience:
