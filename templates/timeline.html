{{ define "timeline" }}
<style scoped>@import url("/timeline.css?5");</style>
<div class="timeline" id="experience-timeline">
	{{ range . }}
	<div class="timeline-entry{{ if .Sabbatical }} sabbatical{{ end }}"{{ if .Sabbatical }} hidden{{ end }}>
		{{ .Content.ToHTML }}
	</div>
	{{ end }}
</div>
<label class="timeline-filter">
	<input type="checkbox" id="show-sabbaticals" role="switch" aria-controls="experience-timeline">
	Show sabbatical leaves
</label>
<script>
(() => {
	const toggle = document.getElementById('show-sabbaticals');
	const sabbaticals = document.querySelectorAll('#experience-timeline > .sabbatical');
	const update = () => {
		// HTMX history snapshots serialize attributes, not checkbox properties.
		toggle.toggleAttribute('checked', toggle.checked);
		for (const entry of sabbaticals) {
			entry.hidden = !toggle.checked;
		}
	};
	toggle.addEventListener('change', () => {
		update();
		if (toggle.checked) {
			window.scrollTo({ top: document.documentElement.scrollHeight, behavior: 'instant' });
		}
	});
	update();
})();
</script>
{{ end }}
