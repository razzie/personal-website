{{ define "layout" }}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="Gábor Görzsöny's personal website">
    <title>{{ .SiteName }}{{ if .PageID }} - {{ .Title }}{{ end }}</title>
	<link rel="stylesheet" href="/pico.min.css">
	<link rel="icon" type="image/webp" sizes="64x64" href="/favicon-64x64.webp">
	<link rel="icon" type="image/webp" sizes="32x32" href="/favicon-32x32.webp">
	<link rel="icon" type="image/webp" sizes="16x16" href="/favicon-16x16.webp">
	<script src="/htmx.min.js" defer></script>
	<script src="/loading-states.min.js" defer></script>
	<script src="/email.js" defer></script>
	<style>
	body > main {
		padding-top: 0.5rem;
	}
	nav {
		align-items: flex-start;
	}
	#title h1 {
		margin-bottom: 0;
	}
	#title.title-with-subtitle h1 {
		font-size: 1.25rem;
		line-height: 1.4;
	}
	#title.title-with-subtitle h1 span {
		display: block;
		color: var(--pico-muted-color);
		font-size: 0.85rem;
		font-weight: 400;
	}
	@media screen and (max-width: 768px) {
		#title {
			display: none;
		}
		#title.title-with-subtitle {
			display: flex;
			order: 1;
			justify-content: center;
			width: 100%;
			margin: 0;
			text-align: center;
		}
		nav {
			display: flex;
			flex-wrap: wrap;
			justify-content: center;
			margin-bottom: var(--pico-typography-spacing-vertical);
		}
		nav ul li {
			font-size: 1.5rem;
		}
		a[aria-current="page"] {
			font-weight: bold;
		}
	}
	</style>
</head>
<body hx-boost="true" hx-ext="loading-states">
	<main class="container">
		<nav>
			<ul id="title"{{ if .HeaderSubtitle }} class="title-with-subtitle"{{ end }}>
				<li>
					<h1 data-loading-aria-busy data-loading-delay="50">{{ .HeaderTitle }}{{ if .HeaderSubtitle }} <span>{{ .HeaderSubtitle }}</span>{{ end }}</h1>
				</li>
			</ul>
			<ul>
			{{ $pageID := .PageID }}
			{{ range .Nav }}
				<li><a href="/{{ .ID }}"{{ if eq .ID $pageID }} aria-current="page"{{ end }}>{{ .Title }}</a></li>
			{{ end }}
			</ul>
		</nav>
		{{ CallTemplate .Template .Data }}
	</main>
</body>
</html>
{{ end }}
